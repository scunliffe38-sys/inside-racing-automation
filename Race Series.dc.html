<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Narrow';src:url('fonts/GothamNarrow-Book.otf') format('opentype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Gotham XNarrow';src:url('fonts/GothamXNarrow-Book.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Gotham XNarrow';src:url('fonts/GothamXNarrow-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:block}
doc-page:not(:defined){visibility:hidden}
body{margin:0}
a{color:#2c9cd7;text-decoration:none}
a:hover{color:#1b7fb4}
</style>
<script src="./doc-page.js"></script>
</helmet>
<doc-page size="a4">

<sc-for list="{{ pages }}" as="p" hint-placeholder-count="1">
<section class="page" data-screen-label="Race Series" style="position:relative;font-family:'Gotham Narrow',sans-serif;color:#2c2e35;background:#fff;padding:0;overflow:hidden">
<div style="position:absolute;left:22.7pt;top:24pt;font-size:10pt;font-weight:400;line-height:1;letter-spacing:.019em">RACE SERIES</div>
<div style="position:absolute;left:22.7pt;top:37pt;width:549.9pt;height:3pt;background:#9ecff0"></div>
<sc-for list="{{ p.titleRow }}" as="t" hint-placeholder-count="1">
<div style="position:absolute;left:22pt;top:50.6pt;font-size:22pt;font-weight:700;line-height:1;letter-spacing:-.01em">Victorian Race Series</div>
<div style="position:absolute;left:22pt;top:73.1pt;width:549.9pt;height:2pt;background:#2c2e35"></div>
</sc-for>

<sc-for list="{{ p.columns }}" as="col" hint-placeholder-count="2">
<div style="position:absolute;left:{{ col.left }};top:{{ p.top }};width:268.4pt">
<sc-for list="{{ col.blocks }}" as="b" hint-placeholder-count="3">
<div style="margin-top:{{ b.gap }}">
<div style="font-size:10pt;font-weight:700;line-height:1;letter-spacing:-.005em">{{ b.title }}</div>
<div style="height:2pt;background:#2c2e35;margin-top:1.2pt"></div>
<sc-for list="{{ b.note }}" as="n" hint-placeholder-count="0">
<div style="margin:6.7pt 0 6.2pt;font-size:7pt;line-height:9.05pt">{{ n.t }}</div>
</sc-for>
<div style="display:flex;font-size:8pt;font-weight:700;line-height:8pt;letter-spacing:.02em">
<sc-for list="{{ b.head }}" as="c" hint-placeholder-count="4">
<div style="width:{{ c.w }};flex:0 0 {{ c.w }};padding:4.6pt 0 2.1pt {{ c.pad }};box-sizing:border-box;box-shadow:inset 0 -0.25pt 0 #2c2e35">{{ c.t }}</div>
</sc-for>
</div>
<sc-for list="{{ b.rows }}" as="r" hint-placeholder-count="9">
<div style="display:flex;line-height:8pt">
<sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="4">
<div style="width:{{ c.w }};flex:0 0 {{ c.w }};padding:4.15pt 0 2.05pt {{ c.pad }};box-sizing:border-box;box-shadow:inset 0 -0.25pt 0 #2c2e35;font-size:{{ c.size }}">{{ c.t }}</div>
</sc-for>
</div>
</sc-for>
</div>
</sc-for>
</div>
</sc-for>


<sc-for list="{{ p.filler }}" as="slot" hint-placeholder-count="0">
<sc-if value="{{ slot.booked }}" hint-placeholder-val="{{ false }}">
<img src="{{ slot.art }}" alt="" style="position:absolute;left:22.7pt;top:{{ slot.top }};width:549.9pt;height:{{ slot.height }};object-fit:cover" />
</sc-if>
<sc-if value="{{ slot.open }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;left:22.7pt;top:{{ slot.top }};width:549.9pt;height:{{ slot.height }};box-sizing:border-box;border:0.75pt dashed #b6bcc3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5pt;color:#9aa1a9">
<div style="font-family:'Gotham XNarrow',sans-serif;font-size:10pt;font-weight:700;letter-spacing:.09em">ADVERTISING SLOT &mdash; {{ slot.id }}</div>
<div style="font-size:7.5pt;letter-spacing:.02em">{{ slot.size }}</div>
</div>
</sc-if>
</sc-for>
<div style="position:absolute;left:12.2pt;bottom:4.2pt;font-family:'Gotham XNarrow',sans-serif;font-size:7pt;line-height:1;letter-spacing:-.013em">{{ footer }}</div>
<div style="position:absolute;right:12.3pt;bottom:4.2pt;font-family:'Gotham XNarrow',sans-serif;font-size:7pt;line-height:1">{{ p.no }}</div>
</section>
</sc-for>

</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { blocks: [], settings: {}, from: 0 };

  // measured from the printed edition: four-column series tables and the
  // three-column highweight schedule, as widths inside a 268.4pt column
  static FOUR = [{ w: 27, pad: 3 }, { w: 50.9, pad: 4 }, { w: 48.1, pad: 4 }, { w: 142.4, pad: 3.9 }];
  static THREE = [{ w: 85, pad: 3 }, { w: 75, pad: 3 }, { w: 108.4, pad: 3 }];

  componentDidMount() {
    // the bookable panel in whatever depth a page has left over
    import('./parsers/ads.js').then(A => { this.ads = A; this.forceUpdate(); }).catch(() => {});
    const faces = document.fonts
      ? Promise.all([
          document.fonts.load('400 7pt "Gotham Narrow"'),
          document.fonts.load('400 6.5pt "Gotham Narrow"'),
          document.fonts.load('400 10pt "Gotham Narrow"'),
          document.fonts.load('700 8pt "Gotham Narrow"'),
          document.fonts.load('700 10pt "Gotham Narrow"'),
          document.fonts.load('700 22pt "Gotham Narrow"'),
          document.fonts.load('400 7pt "Gotham XNarrow"')
        ]).then(() => document.fonts.ready)
      : Promise.resolve();
    Promise.all([
      // The highweight schedule arrives as its own monthly document, in the same
      // shape the series parser already reads: one heading, one three-column
      // DATE / VENUE / RACE table. It prints last, at the foot of column two.
      import('./parsers/series.js').then(m => Promise.all([
        m.loadSeries('inputs/Race Series.docx'),
        m.loadSeries('inputs/Highweights.docx')
          .catch(e => ({ blocks: [], count: 0, warnings: ['Highweight Schedule: ' + (e.message || e)] }))
      ])).then(([a, b]) => ({
        // tail: printed last, at the foot of column two, whatever the series
        // count — it does not take its turn in the alternation
        blocks: a.blocks.concat(b.blocks.map(x => ({ ...x, tail: true }))),
        count: a.count + b.count,
        warnings: a.warnings.concat(b.warnings)
      })),
      import('./parsers/settings.js').then(m => m.loadSettings('inputs/Edition Settings.xlsx')),
      faces
    ]).then(([s, cfg]) => {
      const settings = (cfg && cfg.settings) || {};
      const warnings = s.warnings.concat((cfg && cfg.warnings) || []);
      if (warnings.length) console.warn('Race Series — ' + s.count + ' blocks, ' + warnings.length + ' to check:\n' + warnings.join('\n'));
      this.setState({ blocks: s.blocks, settings }, () => requestAnimationFrame(() => {
        const dp0 = document.querySelector('doc-page');
        if (dp0) dp0.setAttribute('data-paged', String(document.querySelectorAll('doc-page > .page').length));
      }));
    });
  }

  componentDidUpdate() {
    const dp = document.querySelector('doc-page');
    if (dp && dp._measure) dp._measure();
    if (this._reported || !this.state.blocks.length) return;
    this._reported = true;
    const n = this.pack().length;
    import('./parsers/pagination.js').then(P => {
      P.report('series', n);
      const from = P.plan(this.state.settings).start.series;
      this.setState({ from }, () => requestAnimationFrame(() => {
        if (dp) dp.setAttribute('data-paged', String(n));
      }));
    });
  }

  /**
   * How deep a series block prints, from the metrics of its own parts: the
   * heading and its rule, an optional note, the column heads and one line per
   * heat. No measuring needed, so the pages can be worked out before layout.
   */
  static depth(b) {
    const note = b.note ? 6.7 + Math.max(1, Math.ceil(String(b.note).length / 62)) * 9.05 + 6.2 : 0;
    return 14.2 + note + 14.7 + (b.rows || []).length * 14.2;
  }

  /**
   * Blocks alternate down the two columns, as the printed edition sets them,
   * and run onto further pages when the two columns are full. The highweight
   * schedule is printed last wherever that falls.
   */
  pack() {
    const PAGE = 841.89, BOTTOM = 30, TOP_FIRST = 93.8, TOP_CONT = 57.9, GAP = 34;
    const order = this.state.blocks.filter(b => !b.tail).concat(this.state.blocks.filter(b => b.tail));
    const limitOf = first => PAGE - (first ? TOP_FIRST : TOP_CONT) - BOTTOM;

    const pages = [];
    let i = 0;
    while (i < order.length) {
      const first = pages.length === 0;
      const limit = limitOf(first);
      const cols = [{ used: 0, blocks: [] }, { used: 0, blocks: [] }];
      let placed = false;
      while (i < order.length) {
        const b = order[i];
        const d = Component.depth(b);
        // the shallower column takes the next block, which keeps the
        // alternation of the printed page while respecting the fit
        const sides = cols[0].used <= cols[1].used ? [0, 1] : [1, 0];
        const side = sides.find(x => cols[x].used + (cols[x].blocks.length ? GAP : 0) + d <= limit);
        if (side === undefined) break;
        cols[side].used += (cols[side].blocks.length ? GAP : 0) + d;
        cols[side].blocks.push(b);
        placed = true;
        i++;
      }
      if (!placed) { cols[0].blocks.push(order[i]); i++; }   // a block taller than the page
      pages.push({ first, cols, height: Math.max(cols[0].used, cols[1].used) });
    }
    if (!pages.length) pages.push({ first: true, cols: [{ blocks: [] }, { blocks: [] }] });
    return pages;
  }

  renderVals() {
    const s = this.state.settings;
    const shape = b => {
      const grid = b.columns.length === 3 ? Component.THREE : Component.FOUR;
      const cell = (t, i) => ({
        t, w: grid[i].w + 'pt', pad: grid[i].pad + 'pt',
        // the printed edition sets the venue a half point smaller than the rest
        size: (grid === Component.FOUR && i === 1 ? 6.5 : 7) + 'pt'
      });
      return {
        title: b.title,
        head: b.columns.map((c, i) => ({ t: c, w: grid[i].w + 'pt', pad: grid[i].pad + 'pt' })),
        rows: b.rows.map(r => ({ cells: grid.map((g, i) => cell(r[i] || '', i)) })),
        note: b.note ? [{ t: b.note }] : []
      };
    };
    const from = this.state.from || 0;
    const placements = (this.state.settings || {}).$placements;
    const slot = (no, top, used) => (this.ads ? this.ads.pageSlot(no, top, used, 811.89, placements) : []);
    const pages = this.pack().map((p, i) => ({
      filler: slot(from ? from + i : '', p.first ? 93.8 : 57.9, p.height || 0),
      top: (p.first ? 93.8 : 57.9) + 'pt',
      titleRow: p.first ? [{}] : [],
      columns: [21.7, 305].map((left, side) => ({
        left: left + 'pt',
        blocks: (p.cols[side] ? p.cols[side].blocks : []).map((b, j) => ({ ...shape(b), gap: j === 0 ? '0pt' : '34pt' }))
      })),
      no: from ? String(from + i) : ''
    }));
    return {
      pages,
      footer: 'INSIDE RACING I ' + (s.edition || '')
    };
  }
}
</script>
</body>
</html>
