<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Narrow';src:url('fonts/GothamNarrow-Book.otf') format('opentype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Gotham XNarrow';src:url('fonts/GothamXNarrow-Book.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Gotham XNarrow';src:url('fonts/GothamXNarrow-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:block}
doc-page:not(:defined){visibility:hidden}
body{margin:0}
a{color:#2c9cd7;text-decoration:none}
a:hover{color:#1b7fb4}
</style>
<script src="./doc-page.js"></script>
</helmet>
<doc-page size="a4">
<sc-for list="{{ pages }}" as="pg" hint-placeholder-count="1">
<section class="page" style="position:relative;font-family:'Gotham Narrow',sans-serif;background:#fff;padding:0;overflow:hidden">
<div style="position:absolute;right:13pt;top:16pt;display:flex;align-items:center;gap:6pt;font-size:9pt;font-weight:700;color:#2c2e35">
<span>KEY</span>
<span style="display:flex;align-items:center;gap:3pt"><span style="width:7pt;height:7pt;background:#ff0040;display:inline-block"></span>Metropolitan</span>
<span style="display:flex;align-items:center;gap:3pt"><span style="width:7pt;height:7pt;background:#00b0f0;display:inline-block"></span>Country</span>
</div>
<div style="position:absolute;left:13pt;right:13pt;top:37pt;height:2.25pt;background:#9ecff0"></div>
<sc-for list="{{ pg.titleRow }}" as="t" hint-placeholder-count="1">
<div style="position:absolute;left:20.7pt;top:47pt;width:560pt;white-space:nowrap;font-family:'Gotham XNarrow',sans-serif;font-size:21pt;font-weight:700;letter-spacing:-.03em;line-height:1.1;color:#2c2e35">{{ t.text }}</div>
</sc-for>
<div style="position:absolute;left:13pt;top:57.9pt;width:569.4pt">
<sc-for list="{{ pg.titleRow }}" as="t" hint-placeholder-count="1"><div style="height:31.2pt"></div></sc-for>
<div style="display:flex;border-top:0.25pt solid #2c2e35;border-left:0.25pt solid #2c2e35;background:#f7f7f8">
<div style="width:67.6pt;flex:0 0 67.6pt;box-sizing:border-box;padding:3.5pt 2pt;border-right:0.25pt solid #2c2e35;border-bottom:0.25pt solid #2c2e35;font-size:7pt;font-weight:700;line-height:7pt;letter-spacing:.01em;color:#2c2e35;white-space:pre-line">MEETING
DETAILS</div>
<sc-for list="{{ headerRest }}" as="h" hint-placeholder-count="13">
<div style="width:38.6pt;flex:0 0 38.6pt;box-sizing:border-box;padding:3.5pt 2pt;border-right:0.25pt solid #2c2e35;border-bottom:0.25pt solid #2c2e35;font-size:7pt;font-weight:700;line-height:7pt;letter-spacing:.01em;color:#2c2e35;white-space:pre-line">{{ h.text }}</div>
</sc-for>
</div>
<div style="position:relative">
<div style="position:absolute;top:0;bottom:0;left:67.6pt;width:38.6pt;background:#edf6fb"></div>
<div style="position:absolute;top:0;bottom:0;left:144.8pt;width:38.6pt;background:#edf6fb"></div>
<div style="position:absolute;top:0;bottom:0;left:222pt;width:38.6pt;background:#edf6fb"></div>
<div style="position:absolute;top:0;bottom:0;left:299.2pt;width:38.6pt;background:#edf6fb"></div>
<div style="position:absolute;top:0;bottom:0;left:376.4pt;width:38.6pt;background:#edf6fb"></div>
<div style="position:absolute;top:0;bottom:0;left:453.6pt;width:38.6pt;background:#edf6fb"></div>
<div style="position:absolute;top:0;bottom:0;left:530.8pt;width:38.6pt;background:#edf6fb"></div>
<sc-for list="{{ pg.rows }}" as="row" hint-placeholder-count="8">
<div data-row="1" lang="en" style="display:flex;position:relative;border-left:0.25pt solid #2c2e35">
<div style="position:relative;width:67.6pt;flex:0 0 67.6pt;box-sizing:border-box;padding:3.5pt 2pt;border-right:0.25pt solid #2c2e35;border-bottom:0.25pt solid #2c2e35;font-size:6.5pt;line-height:6.3pt;color:#2c2e35;white-space:pre-wrap;hyphens:auto;overflow-wrap:break-word">
<sc-for list="{{ row.a }}" as="r" hint-placeholder-count="4">
<sc-for list="{{ r.dt }}" as="v" hint-placeholder-count="0"><span style="font-size:8pt;font-weight:700;line-height:9pt;letter-spacing:-.03em">{{ v.t }}</span></sc-for>
<sc-for list="{{ r.vm }}" as="v" hint-placeholder-count="0"><span style="font-size:8pt;font-weight:700;line-height:9pt;letter-spacing:-.03em;color:#ff0040">{{ v.t }}</span></sc-for>
<sc-for list="{{ r.vc }}" as="v" hint-placeholder-count="0"><span style="font-size:8pt;font-weight:700;line-height:9pt;letter-spacing:-.03em;color:#00b0f0">{{ v.t }}</span></sc-for>
<sc-for list="{{ r.n }}" as="v" hint-placeholder-count="0"><span>{{ v.t }}</span></sc-for>
<sc-for list="{{ r.b }}" as="v" hint-placeholder-count="0"><span style="font-weight:700">{{ v.t }}</span></sc-for>
<sc-for list="{{ r.rd }}" as="v" hint-placeholder-count="0"><span style="font-weight:700;color:#ff0040">{{ v.t }}</span></sc-for>
<sc-for list="{{ r.sep }}" as="v" hint-placeholder-count="0"><span style="display:inline-block;max-width:100%;overflow:hidden;white-space:pre;vertical-align:top">{{ v.t }}</span></sc-for>
</sc-for>
</div>
<sc-for list="{{ row.rest }}" as="c" hint-placeholder-count="13">
<div style="position:relative;width:38.6pt;flex:0 0 38.6pt;box-sizing:border-box;padding:3.5pt 2pt;border-right:0.25pt solid #2c2e35;border-bottom:0.25pt solid #2c2e35;font-size:6.5pt;line-height:6.3pt;color:#2c2e35;white-space:pre-wrap;hyphens:auto;overflow-wrap:break-word">
<sc-for list="{{ c.runs }}" as="r" hint-placeholder-count="3">
<sc-for list="{{ r.n }}" as="v" hint-placeholder-count="1"><span>{{ v.t }}</span></sc-for>
<sc-for list="{{ r.b }}" as="v" hint-placeholder-count="0"><span style="font-weight:700">{{ v.t }}</span></sc-for>
<sc-for list="{{ r.rd }}" as="v" hint-placeholder-count="0"><span style="font-weight:700;color:#ff0040">{{ v.t }}</span></sc-for>
<sc-for list="{{ r.sep }}" as="v" hint-placeholder-count="0"><span style="display:inline-block;max-width:100%;overflow:hidden;white-space:pre;vertical-align:top">{{ v.t }}</span></sc-for>
</sc-for>
</div>
</sc-for>
</div>
</sc-for>
</div>
</div>
<div style="position:absolute;left:12pt;bottom:14pt;font-size:7pt;color:#2c2e35">{{ footer }}</div>
<div style="position:absolute;right:19pt;bottom:14pt;font-size:7pt;color:#2c2e35">{{ pg.no }}</div>
</section>
</sc-for>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { data: null, pages: null };

  componentDidMount() {
    const faces = document.fonts
      ? Promise.all([
          document.fonts.load('400 6.5pt "Gotham Narrow"'),
          document.fonts.load('700 6.5pt "Gotham Narrow"'),
          document.fonts.load('700 8pt "Gotham Narrow"'),
          document.fonts.load('700 21pt "Gotham XNarrow"'),
          document.fonts.load('400 6.5pt "Gotham XNarrow"')
        ]).then(() => document.fonts.ready)
      : Promise.resolve();
    Promise.all([
      import('./parsers/settings.js')
        .then(m => m.loadSettings('inputs/Edition Settings.xlsx'))
        .then(cfg => cfg.settings.edition)
        .catch(() => '')
        .then(edition => {
          this._edition = edition || '';
          return import('./parsers/chart.js').then(m => m.loadCharts('inputs/', edition));
        }),
      faces
    ]).then(([c]) => {
      if (c.months && c.months.length) {
        console.info('Programs Summary Chart — read ' + c.months.length + ' month'
          + (c.months.length > 1 ? 's' : '') + ' in order: '
          + c.months.map(m => m.month + ' (' + m.count + ')').join(', '));
      }
      if (c.warnings.length) console.warn('Programs Summary Chart — ' + c.count + ' meetings, ' + c.warnings.length + ' to check:\n' + c.warnings.join('\n'));
      this.setState({ data: { header: c.header, rows: c.rows } });
    });
  }

  componentDidUpdate() {
    this.pack();
    const dp = document.querySelector('doc-page');
    if (dp && dp._measure) dp._measure();
  }

  classify(runs, isMeeting) {
    const empty = () => ({ n: [], b: [], rd: [], dt: [], vm: [], vc: [], sep: [] });
    const bucket = (r, i) => {
      if (isMeeting && i === 0) return 'dt';
      if (isMeeting && r.s === 9 && r.c === '#FF0040') return 'vm';
      if (isMeeting && r.s === 9 && r.c === '#00B0F0') return 'vc';
      if (r.b && r.c === '#FF0040') return 'rd';
      if (r.b) return 'b';
      return 'n';
    };
    // A rule of dashes divides two entries inside one cell. Left as ordinary
    // text in a 34pt column it breaks over four lines, which ran the chart five
    // pages long. It usually sits inside a larger run rather than being a run of
    // its own, so every run is split on its dashes and the dashes are set on one
    // line and clipped to the cell.
    const out = [];
    runs.forEach((r, i) => {
      const key = bucket(r, i);
      const text = key === 'dt' ? String(r.t).toUpperCase() : String(r.t);
      text.split(/([-\u2013\u2014]{3,})/).forEach(part => {
        if (!part) return;
        const o = empty();
        if (/^[-\u2013\u2014]{3,}$/.test(part)) o.sep.push({ t: part });
        else o[key].push({ t: part });
        out.push(o);
      });
    });
    return out;
  }

  title() {
    const d = this.state.data;
    if (!d || !d.rows.length) return 'Programs Summary Chart';
    const M = { Jan: 'January', Feb: 'February', Mar: 'March', Apr: 'April', May: 'May', Jun: 'June', Jul: 'July', Aug: 'August', Sep: 'September', Oct: 'October', Nov: 'November', Dec: 'December' };
    const mon = row => {
      const t = (row.cells[0][0] || {}).t || '';
      const m = t.match(/-([A-Za-z]{3})-/);
      return m ? M[m[1]] : '';
    };
    const a = mon(d.rows[0]), b = mon(d.rows[d.rows.length - 1]);
    return 'Programs Summary Chart ' + (a === b ? a : a + ' - ' + b);
  }

  buildRows() {
    const d = this.state.data;
    if (!d) return [];
    return d.rows.map((row, i) => ({
      a: this.classify(row.cells[0], true),
      rest: row.cells.slice(1).map(c => ({ runs: this.classify(c, false) }))
    }));
  }

  pack() {
    if (!this.state.data || this.state.pages || this._packed) return;
    const els = Array.from(document.querySelectorAll('[data-row]'));
    if (els.length !== this.state.data.rows.length) return;
    this._packed = true;
    const toPt = px => px * 72 / 96;
    const h = els.map(e => toPt(e.getBoundingClientRect().height));
    const all = this.buildRows();
    const LIMIT_FIRST = 841.89 - (89.1 + 26.4) - 30;
    const LIMIT_CONT = 841.89 - (57.9 + 26.4) - 30;
    const pages = [];
    let i = 0, p = 0;
    while (i < all.length) {
      const limit = p === 0 ? LIMIT_FIRST : LIMIT_CONT;
      let used = 0;
      const rows = [];
      while (i < all.length && (used + h[i] <= limit || !rows.length)) {
        used += h[i]; rows.push(all[i]); i++;
      }
      pages.push({ rows, titleRow: p === 0 ? [{ text: this.title() }] : [], no: 0 });
      p++;
    }
    import('./parsers/pagination.js').then(P => {
      P.report('chart', pages.length);
      const from = P.plan({}).start.chart;
      pages.forEach((pg, i) => { pg.no = from + i; });
      const announce = () => {
        const dp0 = document.querySelector('doc-page');
        if (dp0) dp0.setAttribute('data-paged', String(pages.length));
      };
      this.setState({ pages, from }, () => requestAnimationFrame(announce));
    });
  }

  renderVals() {
    const d = this.state.data;
    const headerRest = d ? d.header.slice(1).map(t => ({ text: t.toUpperCase() })) : [];
    const pages = this.state.pages
      ? this.state.pages
      : (d ? [{ rows: this.buildRows(), titleRow: [{ text: this.title() }], no: this.state.from || 0 }] : []);
    return { pages, headerRest, footer: 'INSIDE RACING I ' + (this._edition || '') };
  }
}
</script>
</body>
</html>
