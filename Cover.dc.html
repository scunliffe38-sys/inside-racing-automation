<script type="text/x-dc" data-dc-script data-props="{}">
// Cover (page 1).
//
// The photograph is supplied as artwork, so the page carries a slot for it and
// everything else is set from Edition Settings: "AUGUST EDITION 2026" prints as
// AUGUST 2026 on the cover, the same way the published edition does.
//
// No folio and no footer — covers carry neither.

class Component extends DCLogic {
  state = { edition: '' };

  componentDidMount() {
    // doc-page only enters paged mode in its own measure pass, and the element
    // may not exist (or may be replaced) when this first runs, so keep asking
    // until the sheet reports itself paginated.
    const paged = (tries) => {
      const dp = document.querySelector('doc-page');
      if (dp) {
        dp.setAttribute('data-paged', String(document.querySelectorAll('doc-page > .page').length));
        // Call the measure synchronously: _scheduleMeasure() no-ops while a
        // stale frame is pending, and that pending frame belongs to a host the
        // DC has since re-rendered, so it never lands.
        dp._raf = null;
        if (dp._measure) dp._measure();
        else if (dp._scheduleMeasure) dp._scheduleMeasure();
        if (dp.shadowRoot && dp.shadowRoot.querySelector('.sheet.paginated')) return;
      }
      if (tries >= 90) {
        console.warn('Cover — doc-page never entered paged mode; the cover will not lay out.');
        return;
      }
      requestAnimationFrame(() => paged(tries + 1));
    };
    if (window.customElements && customElements.whenDefined) {
      customElements.whenDefined('doc-page').then(() => paged(0));
    } else {
      requestAnimationFrame(() => paged(0));
    }
    this._paged = paged;
    const faces = document.fonts
      ? Promise.all([
          document.fonts.load('400 54pt "Gotham XNarrow"'),
          document.fonts.load('700 54pt "Gotham XNarrow"'),
          document.fonts.load('700 12pt "Gotham XNarrow"'),
          document.fonts.load('400 8pt "Gotham Narrow"')
        ]).then(() => document.fonts.ready)
      : Promise.resolve();
    Promise.all([
      import('./parsers/settings.js')
        .then(m => m.loadSettings('inputs/Edition Settings.xlsx'))
        .catch(e => ({ settings: {}, warnings: ['could not read Edition Settings: ' + (e.message || e)] })),
      faces
    ]).then(([cfg]) => {
      if (cfg.warnings && cfg.warnings.length) {
        console.warn('Cover — ' + cfg.warnings.length + ' to check:\n' + cfg.warnings.join('\n'));
      }
      this.setState({ edition: (cfg.settings || {}).edition || '' }, () => requestAnimationFrame(() => paged(0)));
    });
  }

  renderVals() {
    // "AUGUST EDITION 2026" -> "AUGUST 2026"
    const e = String(this.state.edition || '').replace(/\s*edition\s*/i, ' ').replace(/\s+/g, ' ').trim();
    return { coverDate: e.toUpperCase() };
  }
}
</script>
