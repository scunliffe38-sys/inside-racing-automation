<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Gotham Narrow';src:url('fonts/GothamNarrow-Book.otf') format('opentype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Gotham XNarrow';src:url('fonts/GothamXNarrow-Book.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Gotham XNarrow';src:url('fonts/GothamXNarrow-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:block}
doc-page:not(:defined){visibility:hidden}
body{margin:0}
a{color:#2c9cd7;text-decoration:none}
a:hover{color:#1b7fb4}
</style>
<script src="./doc-page.js"></script>
</helmet>
<doc-page size="a4">

<sc-for list="{{ pages }}" as="p" hint-placeholder-count="1">
<section class="page" data-screen-label="Jump-Outs and Flat Trials" style="position:relative;font-family:'Gotham Narrow',sans-serif;color:#2c2e35;background:#fff;padding:0;overflow:hidden">
<div style="position:absolute;left:22.7pt;top:24pt;font-size:10pt;font-weight:400;line-height:1;letter-spacing:.019em">JUMP-OUTS AND OFFICIAL FLAT TRIALS</div>
<div style="position:absolute;left:22.7pt;top:37pt;width:549.9pt;height:3pt;background:#9ecff0"></div>

<sc-for list="{{ p.firstOnly }}" as="f" hint-placeholder-count="1">
<div style="position:absolute;left:22pt;top:59.3pt;font-size:24pt;font-weight:700;line-height:1;letter-spacing:-.01em">Jump-Out Schedule</div>
</sc-for>

<sc-for list="{{ p.months }}" as="m" hint-placeholder-count="2">
<div style="position:absolute;left:{{ m.left }};top:94.4pt;width:267.5pt">
<div style="font-size:12pt;font-weight:700;line-height:1;letter-spacing:-.005em">{{ m.label }}</div>
<div style="height:2pt;background:#2c2e35;margin-top:6.9pt"></div>
</div>
<div style="position:absolute;left:{{ m.colA }};top:115.65pt;width:126.5pt;font-size:7pt">
<sc-for list="{{ m.left1 }}" as="e" hint-placeholder-count="13">
<div style="display:flex;justify-content:space-between;gap:6pt;padding-top:2pt;line-height:8pt;box-shadow:inset 0 -0.25pt 0 #2c2e35"><span style="white-space:nowrap">{{ e.date }}</span><span style="text-align:right">{{ e.venue }}</span></div>
</sc-for>
</div>
<div style="position:absolute;left:{{ m.colB }};top:115.65pt;width:126.5pt;font-size:7pt">
<sc-for list="{{ m.right1 }}" as="e" hint-placeholder-count="13">
<div style="display:flex;justify-content:space-between;gap:6pt;padding-top:2pt;line-height:8pt;box-shadow:inset 0 -0.25pt 0 #2c2e35"><span style="white-space:nowrap">{{ e.date }}</span><span style="text-align:right">{{ e.venue }}</span></div>
</sc-for>
</div>
</sc-for>

<div style="position:absolute;left:21.7pt;top:{{ p.trialsTitleTop }};font-size:24pt;font-weight:700;line-height:1;letter-spacing:-.01em">{{ p.trialsTitle }}</div>

<sc-for list="{{ p.dividers }}" as="d" hint-placeholder-count="2">
<div style="position:absolute;left:{{ d.left }};top:{{ p.rulesTop }};width:0.75pt;height:{{ p.rulesHeight }};background:#2c2e35"></div>
</sc-for>

<sc-for list="{{ p.meetings }}" as="t" hint-placeholder-count="3">
<div style="position:absolute;left:{{ t.left }};top:{{ p.trialsTop }};width:126.5pt">
<div style="height:3.5pt;background:#2c2e35"></div>
<div style="margin-top:3.75pt;font-size:9.3pt;font-weight:700;line-height:1;letter-spacing:.01em">{{ t.venue }}</div>
<div style="margin-top:3.8pt;font-size:8pt;font-weight:400;line-height:1;letter-spacing:.01em">{{ t.date }}</div>
<sc-for list="{{ t.races }}" as="r" hint-placeholder-count="7">
<div style="margin-top:3.9pt;display:flex;justify-content:space-between;gap:5pt;background:#d8d9da;height:10pt;box-sizing:border-box;padding:1.8pt 3pt 0;font-size:6.5pt;line-height:7.6pt"><span>{{ r.cond }}</span><span style="text-align:right">{{ r.dist }}</span></div>
<div style="margin-top:1.95pt;font-size:7pt;line-height:9pt">{{ r.title }}</div>
</sc-for>
</div>
</sc-for>

<sc-for list="{{ p.firstOnly }}" as="f" hint-placeholder-count="1">
<div style="position:absolute;left:20.7pt;top:543.6pt;font-size:20pt;font-weight:700;line-height:1;letter-spacing:-.01em">{{ policyHeading }}</div>
<div style="position:absolute;left:22.7pt;top:567.2pt;width:549.9pt;height:3pt;background:#2c2e35"></div>
<div style="position:absolute;left:22.7pt;top:582.2pt;width:545.3pt;font-size:8pt;line-height:9.6pt">
<sc-for list="{{ policy }}" as="q" hint-placeholder-count="8">
<div style="display:flex"><span style="width:8.5pt;flex:0 0 8.5pt">&bull;</span><span style="flex:1">{{ q.t }}</span></div>
</sc-for>
</div>
</sc-for>

<div style="position:absolute;left:12.2pt;bottom:4.2pt;font-family:'Gotham XNarrow',sans-serif;font-size:7pt;line-height:1;letter-spacing:-.013em">{{ footer }}</div>
<div style="position:absolute;right:12.3pt;bottom:4.2pt;font-family:'Gotham XNarrow',sans-serif;font-size:7pt;line-height:1">{{ p.no }}</div>
</section>
</sc-for>

</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { blocks: [], meetings: [], policy: [], settings: {}, from: 0 };

  // page 50 sets four columns of 126.5pt on a 141.2pt pitch
  static COL = i => 22.7 + i * 141.2;

  componentDidMount() {
    const faces = document.fonts
      ? Promise.all([
          document.fonts.load('400 7pt "Gotham Narrow"'),
          document.fonts.load('400 8pt "Gotham Narrow"'),
          document.fonts.load('400 6.5pt "Gotham Narrow"'),
          document.fonts.load('400 10pt "Gotham Narrow"'),
          document.fonts.load('700 9.3pt "Gotham Narrow"'),
          document.fonts.load('700 12pt "Gotham Narrow"'),
          document.fonts.load('700 20pt "Gotham Narrow"'),
          document.fonts.load('700 24pt "Gotham Narrow"'),
          document.fonts.load('400 7pt "Gotham XNarrow"')
        ]).then(() => document.fonts.ready)
      : Promise.resolve();
    const text = f => fetch('inputs/' + f).then(r => r.text());
    Promise.all([
      import('./parsers/jumpouts.js').then(m => m.loadJumpOuts('inputs/Jump Outs.xlsx')),
      import('./parsers/trials.js').then(m => m.loadTrials('inputs/Official Flat Trials.csv')),
      import('./parsers/notices.js').then(m => m.loadPolicy('inputs/Division of Races Policy.docx'))
        .catch(e => ({ heading: '', bullets: [], warnings: ['Division of Races Policy: could not read the document: ' + (e.message || e)] })),
      import('./parsers/settings.js').then(m => m.loadSettings('inputs/Edition Settings.xlsx')),
      faces
    ]).then(([j, t, pol, s]) => {
      const settings = s.settings;
      const warnings = j.warnings.concat(t.warnings, pol.warnings || [], s.warnings);
      if (warnings.length) console.warn('Jump-outs and flat trials — ' + warnings.length + ' to check:\n' + warnings.join('\n'));
      this.setState({
        blocks: j.blocks,
        meetings: t.meetings,
        policy: (pol.bullets || []).map(t2 => ({ t: t2 })),
        policyHeading: pol.heading || 'Division of Races Policy at Country TAB Race Meetings',
        settings
      }, () => requestAnimationFrame(() => {
        const dp0 = document.querySelector('doc-page');
        if (dp0) dp0.setAttribute('data-paged', String(document.querySelectorAll('doc-page > .page').length));
      }));
    });
  }

  componentDidUpdate() {
    const dp = document.querySelector('doc-page');
    if (dp && dp._measure) dp._measure();
    if (this._reported || !this.state.meetings.length) return;
    this._reported = true;
    const n = this.pack().length;
    import('./parsers/pagination.js').then(P => {
      P.report('jumpouts', n);
      const from = P.plan(this.state.settings).start.jumpouts;
      this.setState({ from }, () => requestAnimationFrame(() => {
        if (dp) dp.setAttribute('data-paged', String(n));
      }));
    });
  }

  /**
   * Four trial meetings to the row. The opening page carries the jump-out
   * schedule above them and the division-of-races policy below, so it takes
   * one row; a month with more trials than that runs the rest onto further
   * pages, four at a time, in the same treatment.
   */
  pack() {
    const PER_PAGE = 4;
    const all = this.state.meetings || [];
    const pages = [{ first: true, meetings: all.slice(0, PER_PAGE) }];
    for (let i = PER_PAGE; i < all.length; i += PER_PAGE) {
      pages.push({ first: false, meetings: all.slice(i, i + PER_PAGE) });
    }
    return pages;
  }

  rows(text) {
    const lines = String(text || '').replace(/\r/g, '').split('\n').filter(l => l.trim());
    if (!lines.length) return [];
    const head = lines[0].split('\t').map(h => h.trim());
    return lines.slice(1).map(l => {
      const c = l.split('\t');
      const o = {};
      head.forEach((h, i) => { o[h] = (c[i] || '').trim(); });
      return o;
    });
  }

  renderVals() {
    const C = Component.COL;
    const s = this.state.settings;
    // the two month blocks each own two of the four columns
    const months = this.state.blocks.slice(0, 2).map((b, i) => ({
      label: b.label,
      left: (i === 0 ? 22.2 : 305.1) + 'pt',
      colA: C(i * 2) + 0.3 + 'pt',
      colB: C(i * 2 + 1) + 0.3 + 'pt',
      left1: b.left,
      right1: b.right
    }));
    const from = this.state.from || 0;
    const pages = this.pack().map((p, i) => {
      const meetings = p.meetings.map((m, j) => ({
        left: C(j) + 'pt', venue: m.venue, date: m.date, races: m.races
      }));
      return {
        firstOnly: p.first ? [{}] : [],
        months: p.first ? months : [],
        meetings,
        // one hairline in each gutter between adjacent trial columns
        dividers: meetings.slice(1).map((m, j) => ({ left: (C(j) + 126.5 + 6.6) + 'pt' })),
        trialsTitle: p.first ? 'Official Flat Trials' : 'Official Flat Trials continued',
        trialsTitleTop: (p.first ? 281 : 59.3) + 'pt',
        trialsTop: (p.first ? 311.85 : 94.4) + 'pt',
        rulesTop: (p.first ? 315 : 97.5) + 'pt',
        rulesHeight: (p.first ? 193 : 640) + 'pt',
        no: from ? String(from + i) : ''
      };
    });
    return {
      pages,
      policy: this.state.policy,
      policyHeading: this.state.policyHeading || 'Division of Races Policy at Country TAB Race Meetings',
      footer: 'INSIDE RACING I ' + (s.edition || '')
    };
  }
}
</script>
</body>
</html>
